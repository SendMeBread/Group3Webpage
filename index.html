<!DOCTYPE HTML>
<html class="bg">
    <head>
        <title>Group 3: Wombats</title>
        <meta charset="utf-8">
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <svg style="display: none;">
        <filter id="wavy-ripple">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.02" numOctaves="1" result="noise">
            <animate 
                attributeName="baseFrequency" 
                values="0.01 0.02; 0.02 0.04; 0.01 0.02" 
                dur="0.0005s" 
                repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="25" />
        </filter>
        </svg>
        <p>Lifestyle of Wombats.<br>Because I say so.</p>
    </body>
</html>
