<!DOCTYPE HTML>
<html lang="en">
    <head>
        <title>Group 3: Wombats</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <svg style="display: none;">
        <filter id="wavy-ripple">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.02" numOctaves="1" result="noise">
            <animate 
                attributeName="baseFrequency" 
                values="0.01 0.02; 0.02 0.04; 0.01 0.02" 
                dur="0.0025s" 
                repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" />
        </filter>
        </svg>
        <h1>Lifestyle and Defense Mechanisms of Wombats.</h1>
        <h2>By Group 3.</h2>
        <audio controls src="Assets/Audio/Wombat_Sound.mp3">Audio not supported.</audio>
        <p>Audio of sound emitting from a wombat.</p>
        <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/DZAT6V-djlQ?si=qxXvfN34JO_VcgRe" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </body>
</html>
